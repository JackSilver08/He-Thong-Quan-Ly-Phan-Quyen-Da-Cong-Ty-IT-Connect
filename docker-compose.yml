services:
  postgres:
    image: postgres:18.6-alpine
    container_name: it-connect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itconnect
      POSTGRES_USER: itconnect
      POSTGRES_PASSWORD: itconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itconnect -d itconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: it-connect-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: it-connect-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.29-alpine
    container_name: it-connect-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "8088:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  dashboard:
    build:
      context: ./dashboard
    container_name: it-connect-dashboard
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8080/api
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  postgres_data:

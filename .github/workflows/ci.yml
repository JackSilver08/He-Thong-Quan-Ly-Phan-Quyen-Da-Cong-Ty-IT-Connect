name: IT Connect CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-quality:
    name: Go unit, race and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Normalize Go modules
        run: go mod tidy

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test -race ./... -count=1

      - name: Vet
        run: go vet ./...

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: itconnect_test
          POSTGRES_USER: itconnect
          POSTGRES_PASSWORD: itconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itconnect -d itconnect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: backend/go.mod

      - name: Normalize Go modules
        working-directory: backend
        run: go mod tidy

      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          IT_CONNECT_INTEGRATION: '1'
          DATABASE_URL: postgres://itconnect:itconnect@localhost:5432/itconnect_test?sslmode=disable
        run: go test ./internal/integration -count=1 -v

  compose-build:
    name: Full Docker Compose build
    runs-on: ubuntu-latest
    needs: [go-quality, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config

      - name: Build all application images
        run: docker compose build

  e2e:
    name: Playwright browser smoke tests
    runs-on: ubuntu-latest
    needs: compose-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          docker compose ps
          docker compose logs --tail=200 backend postgres
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready"
          docker compose ps
          docker compose logs --tail=200 frontend backend
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: 'true'
          BASE_URL: http://127.0.0.1:3000
          E2E_USERNAME: admin
          E2E_PASSWORD: Admin@123456
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop application stack
        if: always()
        run: docker compose down -v
